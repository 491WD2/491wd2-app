[build]
  command = "npm run build"
  publish = "dist"

# History-based routing (`window.history` / client-side paths): serve `index.html` for unknown paths.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  framework = "#custom"

[functions]
  directory = "netlify/functions"
